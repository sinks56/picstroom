<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PicStroom" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/picstroom/favicon.svg" />
    <link rel="apple-touch-icon" href="/picstroom/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/picstroom/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/picstroom/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/picstroom/icons/icon-167.png" />
    
    <!-- Splash Screens for iPad -->
    <link rel="apple-touch-startup-image" 
          media="screen and (device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
          href="/picstroom/splash/ipad-portrait.png" />
    <link rel="apple-touch-startup-image" 
          media="screen and (device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)"
          href="/picstroom/splash/ipad-landscape.png" />
    <link rel="apple-touch-startup-image" 
          media="screen and (device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
          href="/picstroom/splash/ipad-pro-10-portrait.png" />
    <link rel="apple-touch-startup-image" 
          media="screen and (device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
          href="/picstroom/splash/ipad-pro-11-portrait.png" />
    <link rel="apple-touch-startup-image" 
          media="screen and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
          href="/picstroom/splash/ipad-pro-12-portrait.png" />
    <link rel="apple-touch-startup-image" 
          media="screen and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)"
          href="/picstroom/splash/ipad-pro-12-landscape.png" />
    
    <title>PicStroom</title>
    <meta name="description" content="Visual inspiration browser - browse beautiful images from RSS feeds" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
